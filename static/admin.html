<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Gestione · CSI Imola Highlights</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="login" id="login-view">
  <form class="card" id="login-form">
    <a class="logo" style="margin-bottom:18px"><span class="dot"></span>Area gestore</a>
    <div class="field"><label>Password</label><input type="password" id="password" autofocus required></div>
    <div id="login-err"></div>
    <button class="btn" style="width:100%">Entra</button>
  </form>
</div>

<div class="admin-layout hidden" id="app-view">
  <aside class="sidebar">
    <a href="/" class="logo" target="_blank"><span class="dot"></span><span data-brand>CSI Imola Highlights</span></a>
    <button data-view="dash" class="active">📊 Panoramica</button>
    <button data-view="fixtures">📅 Partite <span class="count hidden" id="cnt-deliver"></span></button>
    <button data-view="bookings">🎟️ Prenotazioni</button>
    <button data-view="teams">📦 Pacchetti</button>
    <button data-view="survey">📝 Sondaggio</button>
    <button data-view="sponsors">🍕 Sponsor</button>
    <button data-view="tools">💬 Messaggi pronti</button>
    <button data-view="settings">⚙️ Impostazioni</button>
    <button id="logout" style="margin-top:20px">↩ Esci</button>
  </aside>
  <main class="main" id="main"></main>
</div>

<dialog id="dlg"><div id="dlg-body"></div></dialog>

<script src="/static/common.js"></script>
<script src="/static/admin.js"></script>
</body>
</html>
